name: Build Release Draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej: v2.5.0). Vacío = usa el tag"
        required: false
        default: ""

# Evita que dos ejecuciones peleen por el mismo draft a la vez.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: steplauncher

jobs:
  # ───────────────────────────────────────────────────────────────
  # Build matrix: genera binarios nativos por plataforma.
  # Cada job SOLO compila y sube su staging como artifact.
  # El draft se crea una única vez en el job `draft` (sin carreras).
  # ───────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 — exe + instalador NSIS
          - platform: windows-latest
            name: windows-amd64
            os: windows
            arch: amd64
            build_task: "windows:build"
            package_task: "windows:package"

          # Windows ARM64 — exe + instalador NSIS (cross-compile Go, sin CGO)
          - platform: windows-latest
            name: windows-arm64
            os: windows
            arch: arm64
            build_task: "windows:build"
            package_task: "windows:package"

          # Linux x64 — bin + AppImage/DEB/RPM/AUR (GTK 4.14+ -> ubuntu-24.04)
          - platform: ubuntu-24.04
            name: linux-amd64
            os: linux
            arch: amd64
            build_task: "linux:build"
            package_task: "linux:package"

          # Linux ARM64 — build nativo en runner ARM (CGO requerido por WebKit)
          - platform: ubuntu-24.04-arm
            name: linux-arm64
            os: linux
            arch: arm64
            build_task: "linux:build"
            package_task: "linux:package"

          # macOS Apple Silicon (nativo)
          - platform: macos-latest
            name: macos-aarch64
            os: darwin
            arch: arm64
            build_task: "darwin:build"
            package_task: "darwin:package"

          # macOS Intel (cross-compile con clang universal del runner)
          - platform: macos-latest
            name: macos-x86_64
            os: darwin
            arch: amd64
            build_task: "darwin:build"
            package_task: "darwin:package"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go (versión de go.mod)
        uses: actions/setup-go@v6
        with:
          go-version-file: launcher/go.mod
          cache: true
          cache-dependency-path: launcher/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Task es el runner de Wails v3 (Taskfile.yml)
      - name: Setup Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Dependencias por plataforma (ANTES de instalar Wails, porque wails3 necesita GTK en Linux) ──
      - name: Instalar dependencias Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -e
          echo "→ Actualizando apt..."
          sudo apt-get update
          echo "→ Instalando dependencias GTK/WebKit (requiere GTK 4.14+ en ubuntu-24.04)..."
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config gcc \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            curl xz-utils
          echo "→ Verificando pkg-config..."
          pkg-config --modversion gtk4 || echo "gtk4 no encontrado"
          pkg-config --modversion webkitgtk-6.0 || echo "webkitgtk-6.0 no encontrado"
          pkg-config --modversion gtk+-3.0 || echo "gtk3 no encontrado"
          pkg-config --modversion webkit2gtk-4.1 || echo "webkit2gtk-4.1 no encontrado"
          pkg-config --atleast-version=4.14 gtk4 && echo "✓ GTK 4.14+ OK" || echo "⚠ GTK <4.14 (fallara el build, se requiere ubuntu-24.04)"
          pkg-config --exists webkitgtk-6.0 && echo "✓ webkitgtk-6.0 OK" || echo "⚠ webkitgtk-6.0 no encontrado"
          gcc --version | head -n 1
          uname -m

          # FUSE para AppImage (si está disponible)
          sudo apt-get install -y libfuse2 2>/dev/null || sudo apt-get install -y libfuse2t64 2>/dev/null || echo "FUSE no disponible, AppImage puede requerirlo"

      - name: Instalar dependencias Windows (NSIS)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "C:\Program Files (x86)\NSIS"
          echo $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path += ";$nsisPath"
          Write-Host "NSIS en $nsisPath"
          & "$nsisPath\makensis.exe" -VERSION
          # Verificación alternativa via PATH en siguientes steps
          try { makensis -VERSION } catch {
            Write-Host "makensis aún no en PATH este step, pero estará disponible en el siguiente via GITHUB_PATH"
          }

      # La versión del CLI se fija desde go.mod: evita derivas de @latest
      # que rompen el build cuando Wails publica una beta nueva.
      - name: Instalar Wails CLI v3 (versión de go.mod)
        working-directory: launcher
        shell: bash
        run: |
          set -e
          WAILS_VERSION="$(go list -m github.com/wailsapp/wails/v3 | awk '{print $2}')"
          echo "→ Wails $WAILS_VERSION (según go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 version

      - name: Verificar herramientas
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 version
          task --version
          go version
          bun --version

      # ── Frontend ──
      - name: Instalar dependencias frontend (bun)
        working-directory: launcher/frontend
        run: bun install --frozen-lockfile

      # ── Build + Package ──
      # El Taskfile se encarga de: generate:bindings → build:frontend → generate:icons → go build
      # package además genera instaladores (.exe NSIS, .deb/.rpm/.AppImage, .app/.dmg)
      - name: Build ${{ matrix.name }}
        working-directory: launcher
        shell: bash
        run: |
          echo "→ Building ${{ matrix.name }} (ARCH=${{ matrix.arch }})"
          task ${{ matrix.build_task }} ARCH=${{ matrix.arch }}

      - name: Package ${{ matrix.name }}
        working-directory: launcher
        shell: bash
        # Windows y Linux generan paquetes; macOS .app es el package
        # Si falla el empaquetado, al menos conservamos el binario
        run: |
          echo "→ Packaging ${{ matrix.name }}"
          task ${{ matrix.package_task }} ARCH=${{ matrix.arch }} || echo "Package opcional falló, continuando con binario"
        continue-on-error: true

      # macOS DMG (solo en macOS, requiere .app ya empaquetado)
      - name: Crear DMG (macOS)
        if: matrix.os == 'darwin'
        working-directory: launcher
        shell: bash
        run: |
          task darwin:package:dmg ARCH=${{ matrix.arch }} || echo "DMG opcional falló (requiere macOS nativo)"
        continue-on-error: true

      # ── Normalizado: TODOS los assets llevan versión + plataforma ──
      # El actualizador (internal/Updater) matchea por subcadenas de SO/arq,
      # así que ningún archivo puede quedar genérico (ej: steplauncher.deb).
      - name: Normalizar artefactos (versión + plataforma)
        working-directory: launcher
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          if [ "$VERSION" = "main" ] || [ "$VERSION" = "develop" ] || [ "$VERSION" = "master" ] || [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="v0.0.0-dev.${{ github.run_number }}"
          fi
          [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Usando VERSION=$VERSION para ${{ matrix.name }}"

          rm -rf dist-release && mkdir -p dist-release
          NAME="${{ matrix.name }}"

          # Binario principal
          if [ -f "bin/steplauncher" ]; then
            cp "bin/steplauncher" "dist-release/steplauncher-${VERSION}-${NAME}"
            echo "✓ binario unix"
          fi
          if [ -f "bin/steplauncher.exe" ]; then
            cp "bin/steplauncher.exe" "dist-release/steplauncher-${VERSION}-${NAME}.exe"
            echo "✓ binario windows"
          fi

          # Instalador NSIS (sale en bin/ o en build/windows/nsis/, sin versión de fábrica)
          for f in bin/*installer*.exe bin/*Installer*.exe build/windows/nsis/*installer*.exe build/windows/nsis/*Installer*.exe; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in steplauncher-v*-*.exe) continue ;; esac
            cp "$f" "dist-release/steplauncher-${VERSION}-${NAME}-installer.exe"
            echo "✓ instalador NSIS: $f"
          done

          # Paquetes Linux (todos versionados; antes salían como steplauncher.deb/.rpm/.AppImage sueltos)
          for f in bin/*.deb; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/steplauncher-${VERSION}-${NAME}.deb"
            echo "✓ deb: $f"
          done
          for f in bin/*.rpm; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/steplauncher-${VERSION}-${NAME}.rpm"
            echo "✓ rpm: $f"
          done
          for f in bin/*.AppImage bin/*.appimage; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/steplauncher-${VERSION}-${NAME}.AppImage"
            echo "✓ AppImage: $f"
          done
          for f in bin/*.pkg.tar.zst; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/steplauncher-${VERSION}-${NAME}.pkg.tar.zst"
            echo "✓ arch: $f"
          done

          # macOS .app (comprimida) y .dmg versionados
          if [ -d "bin/steplauncher.app" ]; then
            (cd bin && tar -czf "../dist-release/steplauncher-${VERSION}-${NAME}.app.tar.gz" steplauncher.app)
            echo "✓ .app tar.gz"
          fi
          if [ -d "bin/Steplauncher.app" ]; then
            (cd bin && tar -czf "../dist-release/steplauncher-${VERSION}-${NAME}.app.tar.gz" Steplauncher.app)
            echo "✓ .app tar.gz (alt)"
          fi
          for f in bin/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/steplauncher-${VERSION}-${NAME}.dmg"
            echo "✓ dmg: $f"
          done

          if [ -z "$(ls -A dist-release)" ]; then
            echo "❌ dist-release vacío: el build no dejó artefactos"
            exit 1
          fi

          echo "=== dist-release/ ==="
          ls -lh dist-release/

      - name: Upload artefacto ${{ matrix.name }}
        uses: actions/upload-artifact@v6
        with:
          name: steplauncher-${{ matrix.name }}-${{ github.sha }}
          path: launcher/dist-release/*
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Draft único: junta las 6 plataformas, genera checksums +
  # latest.yml/latest.json para el actualizador y crea UN solo draft
  # presentable con gh CLI (sin carreras entre jobs).
  # ───────────────────────────────────────────────────────────────
  draft:
    name: Crear Draft Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v7
        with:
          path: all-dist
          merge-multiple: true

      - name: Resolver versión y canal
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          fi
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE="true"
            CANAL="beta 🧪"
            AVISO="> ⚠️ **Versión de pruebas (beta):** puede contener errores. Si buscas estabilidad, espera a la release final."
          else
            PRERELEASE="false"
            CANAL="estable ✅"
            AVISO="> ✅ **Versión estable:** recomendada para todos los usuarios."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "canal<<EOF"
            echo "$CANAL"
            echo "EOF"
            echo "aviso<<EOF"
            echo "$AVISO"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG prerelease=$PRERELEASE"
          ls -lhR all-dist | head -n 60

      # Genera CHECKSUMS-SHA256.txt, latest.json/latest.yml (version, notes,
      # pub_date, platforms{signature,url,sha256}) y la tabla de descargas.
      - name: Generar checksums + latest.yml/json + tabla
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          python3 - <<"PYEOF"
          import base64, datetime, hashlib, json, os

          dist = "all-dist"
          tag = os.environ["TAG"]
          short = tag[1:] if tag.startswith("v") else tag
          repo = os.environ.get("GITHUB_REPOSITORY", "NovaStepStudio/StepLauncher")
          pub_date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          files = sorted(
              f for f in os.listdir(dist)
              if os.path.isfile(os.path.join(dist, f)) and not f.startswith(".")
          )
          assert files, "sin artefactos para publicar"

          def plat_key(fname):
              l = fname.lower()
              if "windows" in l or l.endswith(".exe"):
                  plat = "windows"
              elif "linux" in l or l.endswith((".deb", ".rpm", ".appimage", ".pkg.tar.zst")):
                  plat = "linux"
              elif "darwin" in l or "macos" in l or "mac" in l or l.endswith(".dmg") or ".app." in l:
                  plat = "darwin"
              else:
                  plat = "unknown"
              if "aarch64" in l or "arm64" in l:
                  arch = "aarch64"
              elif "amd64" in l or "x86_64" in l or "x64" in l:
                  arch = "x86_64"
              else:
                  arch = "unknown"
              key = f"{plat}-{arch}"
              if "-installer." in l or "installer" in l:
                  key += "-nsis"
              elif l.endswith(".deb"):
                  key += "-deb"
              elif l.endswith(".rpm"):
                  key += "-rpm"
              elif l.endswith(".appimage"):
                  key += "-appimage"
              elif l.endswith(".pkg.tar.zst"):
                  key += "-aur"
              elif l.endswith(".app.tar.gz"):
                  key += "-app"
              elif l.endswith(".dmg"):
                  key += "-dmg"
              return key

          checksums, platforms, rows = [], {}, []
          for fname in files:
              path = os.path.join(dist, fname)
              size = os.path.getsize(path)
              with open(path, "rb") as fh:
                  data = fh.read()
              sha256 = hashlib.sha256(data).hexdigest()
              sig = base64.b64encode(hashlib.sha512(data).digest()).decode()
              checksums.append(f"{sha256}  {fname}")
              platforms[plat_key(fname)] = {
                  "signature": sig,
                  "url": f"{base_url}/{fname}",
                  "sha256": sha256,
              }
              mb = size / (1024 * 1024)
              rows.append(f"| `{fname}` | {mb:.1f} MB | `{sha256[:12]}…` |")

          with open("all-dist/CHECKSUMS-SHA256.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(checksums) + "\n")

          manifest = {
              "version": short,
              "notes": f"StepLauncher {tag}: ver notas completas en la página de la release.",
              "pub_date": pub_date,
              "platforms": platforms,
          }
          with open("all-dist/latest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")

          with open("all-dist/latest.yml", "w", encoding="utf-8") as fh:
              fh.write(f'version: "{short}"\n')
              fh.write(f'notes: "{manifest["notes"]}"\n')
              fh.write(f'pub_date: "{pub_date}"\n')
              fh.write("platforms:\n")
              for key in sorted(platforms):
                  p = platforms[key]
                  fh.write(f"  {key}:\n")
                  fh.write(f'    signature: "{p["signature"]}"\n')
                  fh.write(f'    url: "{p["url"]}"\n')
                  fh.write(f'    sha256: "{p["sha256"]}"\n')

          with open("assets-table.md", "w", encoding="utf-8") as fh:
              fh.write("| Archivo | Tamaño | SHA-256 |\n")
              fh.write("|---|---|---|\n")
              fh.write("\n".join(rows) + "\n")

          print(f"✓ {len(files)} assets, latest.yml/json + checksums generados")
          PYEOF
          ls -lh all-dist/

      - name: Componer cuerpo del draft
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notas generadas por GitHub (mismo motor que "Generate release notes").
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' > generated-notes.md 2>/dev/null \
            || echo "_Notas automáticas no disponibles para este tag._" > generated-notes.md

          {
            echo "# ⬇️ StepLauncher $TAG"
            echo ""
            echo "![versión](https://img.shields.io/badge/versión-${TAG}-blue) ![canal](https://img.shields.io/badge/canal-${{ steps.meta.outputs.canal }}-green) ![plataformas](https://img.shields.io/badge/plataformas-Windows_%7C_Linux_%7C_macOS-lightgrey)"
            echo ""
            echo "${{ steps.meta.outputs.aviso }}"
            echo ""
            echo "## 📋 Novedades"
            echo ""
            cat generated-notes.md
            echo ""
            echo "## 📦 Descargas"
            echo ""
            echo "Elige el archivo de tu sistema operativo. Todos los nombres incluyen **versión + plataforma**."
            echo ""
            cat assets-table.md
            echo ""
            echo "<details>"
            echo "<summary><b>🛠️ Cómo instalar</b></summary>"
            echo ""
            echo "**Windows:** ejecuta el \`*-installer.exe\` (recomendado) o usa el portable \`*.exe\`. Puede pedir WebView2 en el primer arranque."
            echo ""
            echo "**Linux:** \`*.deb\` (Debian/Ubuntu), \`*.rpm\` (Fedora/RHEL), \`*.pkg.tar.zst\` (Arch) o \`*.AppImage\` portable (\`chmod +x\` antes de abrir). Requiere GTK 4.14+ y WebKitGTK 6.0."
            echo ""
            echo "**macOS:** abre el \`*.dmg\` o descomprime el \`*.app.tar.gz\` y arrastra a Aplicaciones. Si macOS bloquea la app, clic derecho → Abrir. Requiere macOS 12+."
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>✅ Verificar la descarga</b></summary>"
            echo ""
            echo "Compara el hash de tu archivo con \`CHECKSUMS-SHA256.txt\`:"
            echo ""
            echo "\`\`\`bash"
            echo "sha256sum -c CHECKSUMS-SHA256.txt   # Linux / macOS"
            echo "\`\`\`"
            echo "\`\`\`powershell"
            echo "certutil -hashfile <archivo> SHA256          # Windows"
            echo "\`\`\`"
            echo ""
            echo "</details>"
            echo ""
            echo "## 🔄 Actualización automática"
            echo ""
            echo "El launcher detecta esta versión solo. Los archivos \`latest.yml\` / \`latest.json\` de esta release alimentan al actualizador con URLs y firmas SHA-512 por plataforma."
            echo ""
            echo "## 🔗 Enlaces"
            echo ""
            echo "- 🌐 Web: https://steplauncher.pages.dev"
            echo "- 🐞 Reportar un problema: https://github.com/${GITHUB_REPOSITORY}/issues"
            echo "- 📜 Historial del launcher: \`launcher/Changelogs/\` del repositorio"
          } > body.md
          wc -l body.md all-dist/latest.yml

      - name: Crear o actualizar draft y subir assets
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FLAGS="--draft --title \"StepLauncher $TAG\" --notes-file body.md"
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ El draft $TAG ya existe, se actualiza"
            # shellcheck disable=SC2086
            gh release edit "$TAG" $FLAGS
          else
            echo "→ Creando draft $TAG"
            # shellcheck disable=SC2086
            gh release create "$TAG" $FLAGS
          fi
          echo "→ Subiendo assets (binarios + instaladores + latest.yml/json + checksums)"
          gh release upload "$TAG" all-dist/* --clobber
          echo "✓ Draft listo: $(gh release view "$TAG" --json url -q '.url')"
