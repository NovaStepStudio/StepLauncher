<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./assets/logo-step.png" />
  <title>StepLauncher</title>
  
  <style>
    #static-splash {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      overflow: hidden;
    }
    
    #static-splash .glow {
      position: absolute;
      width: 36rem;
      height: 36rem;
      background: radial-gradient(
      circle at center,
      rgba(94, 216, 154, 0.12) 0%,
      transparent 70%
      );
      animation: glowPulse 3s ease-in-out infinite;
    }
    
    @keyframes glowPulse {
      0%,
      100% {
        opacity: 0.8;
        transform: scale(1);
      }
      
      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }
    
    #static-splash .logo {
      width: 6.2rem;
      max-width: 42vw;
      height: auto;
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.6));
      animation: logoFloat 2.8s ease-in-out infinite;
    }
    
    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }
      
      50% {
        transform: translateY(-4px);
      }
    }
    
    #static-splash .bottom {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.1rem 0.9rem;
      color: rgba(255, 255, 255, 0.42);
      font-family: Inter, sans-serif;
      font-size: 0.64rem;
    }
    
    #static-splash .loader {
      width: 2rem;
      height: auto;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <div id="static-splash">
    <div class="glow"></div>
    
    <img
    class="logo"
    src="./assets/logo-step.png"
    alt="StepLauncher"
    draggable="false"
    />
    
    <div class="bottom">
      <span>Cargando StepLauncher</span>
      <img
      class="loader"
      src="./assets/gif/chicken_jockey_run.gif"
      alt=""
      />
    </div>
  </div>
  
  <div id="app"></div>
  <script type="module" src="./src/Main.ts"></script>
</body>
</html>
